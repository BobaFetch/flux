name: Neovim oracle

# Checks that the recorded expectations (oracle cases, the indent corpus, the default
# colorscheme) still match real Neovim. They can only drift when their inputs or the scripts
# that record them change, so this runs only then (or by hand).

on:
  push:
    branches: [main]
    paths:
      - crates/flux-vim/tests/oracle/**
      - crates/flux-vim/tests/indent/**
      - crates/flux-view/src/colors.json
      - xtask/**
      - .github/workflows/oracle.yml
  pull_request:
    paths:
      - crates/flux-vim/tests/oracle/**
      - crates/flux-vim/tests/indent/**
      - crates/flux-view/src/colors.json
      - xtask/**
      - .github/workflows/oracle.yml
  workflow_dispatch:

concurrency:
  group: oracle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          # Must match crates/flux-vim/tests/oracle/NVIM_VERSION.
          version: v0.12.5
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask oracle check
      - run: cargo xtask indent check
      - run: cargo xtask colors check
