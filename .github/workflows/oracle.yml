name: Neovim oracle

# Check the oracle, indent corpus and default colors against pinned Neovim on Linux
# on every PR and push to main, or by hand.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: oracle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracle:
    name: neovim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          # Must match crates/flux-vim/tests/oracle/NVIM_VERSION.
          version: v0.12.5
      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup show
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          key: neovim
      - run: cargo xtask oracle check
      - run: cargo xtask indent check
      - run: cargo xtask colors check
