name: CI

# Tests and clippy run on Linux and macOS; fmt, deny and ShellCheck run on Linux.
# Standard macOS runners are free for public repositories.

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: macOS runner
        if: runner.os == 'macOS'
        run: |
          uname -m
          sw_vers
      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup show
          rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Test (NO_COLOR, dumb terminal)
        env:
          NO_COLOR: "1"
          TERM: dumb
        run: cargo test --workspace

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck
        run: shellcheck -s sh .sectorfive/bin/role
      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup show
          rustc --version
      - name: Format
        run: cargo fmt --all --check
      - name: Licenses and advisories
        uses: EmbarkStudios/cargo-deny-action@v2
